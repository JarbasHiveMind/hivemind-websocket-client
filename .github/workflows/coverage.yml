name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@dev
    secrets: inherit
    with:
      python_version: '3.11'
      coverage_source: 'hivemind_bus_client'
      install_extras: 'test'
      test_path: 'tests/'
      pre_install_pip: '"hivescope==0.3.0a1"'
      min_coverage: 0
