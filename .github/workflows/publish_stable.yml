name: Publish Stable Release

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  publish_stable:
    uses: OpenVoiceOS/gh-automations/.github/workflows/publish-stable.yml@dev
    secrets: inherit
    with:
      version_file: 'hivemind_bus_client/version.py'
      publish_pypi: true
      notify_matrix: true
