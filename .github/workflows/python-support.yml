name: Python Support

on:
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

jobs:
  python_support:
    uses: OpenVoiceOS/gh-automations/.github/workflows/python-support.yml@dev
    secrets: inherit
    with:
      package_name: 'hivemind_bus_client'
      version_file: 'hivemind_bus_client/version.py'
      entry_point: 'hivemind-client'
      python_versions: '["3.10", "3.11", "3.12", "3.13"]'
